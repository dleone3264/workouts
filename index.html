<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Run + Lift Split</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #eff3f6; }
  #lift-cal-root {
    --bg: #eff3f6;
    --surface: #ffffff;
    --border: #dce4ea;
    --border-mid: #c6d2db;
    --text-primary: #59544d;
    --text-secondary: #7a7266;
    --text-muted: #4a443a;
    --check-color: #5b7c99;
    --gold: #c9a05c;
    --radius: 8px;
    --radius-sm: 5px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.5;
    padding: 28px 20px 36px;
    border-radius: 14px;
    max-width: 980px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  #lift-cal-root * { box-sizing: border-box; }
  .lc-eyebrow { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .lc-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; padding-bottom: 1.25rem; border-bottom: 1.5px solid var(--border-mid); margin-bottom: 1.25rem; }
  .lc-title { font-family: 'Poppins', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .lc-sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
  .lc-stats { text-align: right; }
  .lc-stats .num { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; color: var(--text-primary); line-height: 1; }
  .lc-stats .lbl { color: var(--text-secondary); font-size: 11.5px; margin-top: 2px; }
  .lc-export-btn { margin-top: 8px; border: 0.5px solid var(--border-mid); background: var(--surface); color: var(--text-secondary); font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; border-radius: 6px; padding: 6px 10px; }
  .lc-export-btn:hover { background: #e4eaf0; color: var(--text-primary); }
  .lc-progress-wrap { margin-bottom: 1.25rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
  .lc-progress-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .lc-progress-flip { border: none; background: none; color: var(--check-color); font-size: 10.5px; font-weight: 600; cursor: pointer; padding: 0 0 0 6px; font-family: 'Inter', sans-serif; }
  .lc-progress-flip:hover { text-decoration: underline; }
  .lc-progress-track { height: 6px; background: #e4eaf0; border-radius: 99px; overflow: hidden; }
  .lc-progress-fill-week { height: 100%; background: var(--check-color); border-radius: 99px; transition: width 0.4s ease; }
  .lc-hint { color: var(--text-secondary); font-size: 12px; margin-bottom: 1rem; padding: 10px 14px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); }
  .lc-viewtoggle { display: flex; gap: 6px; margin-bottom: 1.25rem; }
  .lc-viewtoggle button { flex: 1; font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; padding: 9px 12px; border-radius: 7px; border: 0.5px solid var(--border-mid); background: var(--surface); color: var(--text-secondary); cursor: pointer; }
  .lc-viewtoggle button.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }

  /* Week grid view */
  .lc-week { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .lc-week.week-complete { box-shadow: 0 0 0 2px #c9a05c55; border-color: var(--gold); }
  .lc-week-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; cursor: pointer; flex-wrap: wrap; }
  .lc-week-head-left { display: flex; align-items: center; gap: 10px; }
  .lc-week-label { font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .lc-week-dates { font-size: 12px; color: var(--text-muted); }
  .lc-week-mini-track { width: 60px; height: 5px; background: #e4eaf0; border-radius: 99px; overflow: hidden; }
  .lc-week-mini-fill { height: 100%; background: var(--check-color); border-radius: 99px; }
  .lc-week-pct { font-size: 11.5px; color: var(--text-secondary); min-width: 32px; text-align: right; }
  .lc-caret { font-size: 11px; color: var(--text-secondary); transition: transform 0.2s ease; }
  .lc-week.open .lc-caret { transform: rotate(90deg); }
  .lc-week-body { display: none; padding: 4px 16px 16px; }
  .lc-week.open .lc-week-body { display: block; }
  .lc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  @media (max-width: 820px) { .lc-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .lc-grid { grid-template-columns: 1fr; gap: 8px; } }

  .lc-day {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 12px 14px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
    position: relative;
    min-width: 0;
    overflow-wrap: break-word;
  }
  .lc-day.drag-over { box-shadow: 0 0 0 2px var(--check-color); transform: scale(1.02); }
  .lc-day.complete { box-shadow: 0 0 0 2px #c9a05c55; border-color: var(--gold); }
  .lc-day-name { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); font-weight: 600; }
  .lc-day-date { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; margin: 2px 0 6px; color: var(--text-primary); }
  .lc-comp-list { display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .lc-day.open .lc-comp-list { flex-direction: column; flex-wrap: nowrap; gap: 0; }
  .lc-comp-add-row { display: none; flex-direction: column; gap: 6px; margin-top: 8px; }
  .lc-day.open .lc-comp-add-row { display: flex; }
  .lc-comp { cursor: default; flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .lc-day.open .lc-comp { cursor: grab; padding: 9px 0; border-bottom: 0.5px solid var(--border); flex: none; }
  .lc-day.open .lc-comp:last-child { border-bottom: none; padding-bottom: 0; }
  .lc-comp.dragging { opacity: 0.4; }
  .lc-comp.swap-selected { box-shadow: 0 0 0 2px var(--check-color); border-radius: var(--radius-sm); }
  .lc-comp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 0; min-width: 0; }
  .lc-day.open .lc-comp-head { margin-bottom: 6px; }
  .lc-drag-handle { display: none; color: var(--text-secondary); font-size: 13px; cursor: grab; line-height: 1; }
  .lc-day.open .lc-drag-handle { display: inline; }
  .lc-type-badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; flex: 0 0 auto; white-space: normal; word-break: break-word; box-sizing: border-box; max-width: 100%; }
  .lc-day.open .lc-type-badge { flex: 1; }
  .lc-swap-btn { display: none; border: 0.5px solid var(--border-mid); background: var(--surface); color: var(--text-secondary); font-size: 13px; line-height: 1; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
  .lc-day.open .lc-swap-btn { display: inline-block; }
  .lc-swap-btn:hover { background: #e4eaf0; color: var(--text-primary); }
  .lc-swap-btn.selected { background: var(--check-color); border-color: var(--check-color); color: #fff; }
  .lc-progress-track-day { height: 4px; background: #e4eaf0; border-radius: 4px; overflow: hidden; margin-bottom: 10px; display: flex; }
  .lc-progress-fill { height: 100%; background: var(--type-color, #999); transition: width 0.25s ease; }
  .lc-ex-list { list-style: none; margin: 0; padding: 0; display: none; flex-direction: column; gap: 7px; }
  .lc-day.open .lc-ex-list { display: flex; }
  .lc-ex { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; line-height: 1.35; cursor: pointer; }
  .lc-ex input { margin-top: 2px; cursor: pointer; }
  .lc-box { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; margin-top: 1px; border-radius: 4px; border: 1.5px solid var(--border-mid); font-size: 11px; font-weight: 700; line-height: 1; cursor: pointer; flex-shrink: 0; color: #fff; user-select: none; }
  .lc-box[data-state="done"] { background: var(--box-color); border-color: var(--box-color); }
  .lc-box[data-state="skipped"] { background: none; border-color: var(--box-color); color: var(--box-color); }
  .lc-ex.checked span.name { text-decoration: line-through; color: var(--text-secondary); }
  .lc-ex.skipped span.name { color: var(--text-secondary); font-style: italic; }
  .lc-ex .sets { display: block; color: var(--text-secondary); font-size: 10.5px; }
  .lc-ex .lc-log-input { display: block; margin-top: 4px; width: 100%; max-width: 160px; font-size: 11.5px; font-family: 'Inter', sans-serif; color: var(--text-primary); background: var(--surface); border: 0.5px solid var(--border-mid); border-radius: 5px; padding: 4px 7px; box-sizing: border-box; }
  .lc-ex .lc-log-input:focus { outline: none; border-color: var(--check-color); }
  .lc-toggle { display: none; font-size: 10.5px; color: var(--text-secondary); margin-top: 8px; text-align: center; }
  .lc-day.open .lc-toggle { display: block; }
  .lc-rest-note { display: none; font-size: 12px; color: var(--text-secondary); font-style: italic; padding: 6px 0; }
  .lc-day.open .lc-rest-note { display: block; }
  .lc-week-footer { display: flex; justify-content: flex-end; margin-top: 12px; }
  .lc-reset { background: var(--surface); border: 0.5px solid var(--border-mid); color: var(--text-secondary); font-size: 11.5px; font-family: 'Inter', sans-serif; font-weight: 500; padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
  .lc-reset:hover { background: #e4eaf0; color: var(--text-primary); }

  @media (max-width: 600px) {
    #lift-cal-root { padding: 18px 12px 28px; font-size: 14.5px; }
    .lc-header { flex-direction: column; align-items: flex-start; }
    .lc-stats { text-align: left; }
    .lc-title { font-size: 22px; }
    .lc-week-mini-track { width: 44px; }
    .lc-day { padding: 14px 14px 16px; }
    .lc-day-date { font-size: 20px; }
    .lc-type-badge { font-size: 11.5px; padding: 4px 10px; }
    .lc-ex { padding: 6px 0; }
    .lc-ex input, .lc-ex .lc-box { width: 19px; height: 19px; flex-shrink: 0; }
    .lc-toggle { padding: 4px 0; }
    .lc-swap-btn { width: 32px; height: 32px; font-size: 15px; }
  }

  /* Day-by-day view */
  .lc-dayview { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .lc-dv-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .lc-dv-nav-btn { border: 0.5px solid var(--border-mid); background: var(--surface); color: var(--text-primary); font-size: 15px; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
  .lc-dv-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .lc-dv-nav-btn:hover:not(:disabled) { background: #e4eaf0; }
  .lc-dv-center { text-align: center; flex: 1; }
  .lc-dv-week-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
  .lc-dv-dayname { font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-top: 2px; }
  .lc-dv-date { font-family: 'Poppins', sans-serif; font-size: 30px; font-weight: 700; margin: 2px 0 12px; }
  .lc-dv-badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .lc-dv-progress-track { height: 6px; background: #e4eaf0; border-radius: 99px; overflow: hidden; margin-bottom: 18px; display: flex; }
  .lc-dv-progress-fill { height: 100%; border-radius: 99px; transition: width 0.25s ease; }
  .lc-dv-ex-list { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .lc-dv-ex { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; }
  .lc-dv-ex input { width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; }
  .lc-dv-ex .lc-box { width: 22px; height: 22px; border-radius: 5px; font-size: 13px; }
  .lc-dv-ex.checked { background: #eef2f6; }
  .lc-dv-ex.checked .name { text-decoration: line-through; color: var(--text-secondary); }
  .lc-dv-ex.skipped .name { color: var(--text-secondary); font-style: italic; }
  .lc-dv-ex .name { font-weight: 600; font-size: 14px; display: block; }
  .lc-dv-ex .sets { color: var(--text-secondary); font-size: 12px; display: block; margin-top: 1px; }
  .lc-dv-ex .lc-log-input { display: block; margin-top: 6px; width: 100%; font-size: 13px; font-family: 'Inter', sans-serif; color: var(--text-primary); background: var(--surface); border: 0.5px solid var(--border-mid); border-radius: 6px; padding: 6px 9px; box-sizing: border-box; }
  .lc-dv-ex .lc-log-input:focus { outline: none; border-color: var(--check-color); }
  .lc-dv-rest { text-align: center; color: var(--text-secondary); font-style: italic; padding: 30px 0; }
  .lc-dv-jump { display: flex; justify-content: center; margin-top: 14px; }
  .lc-dv-jump button { border: none; background: none; color: var(--check-color); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 6px 10px; }
  .lc-dv-add-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .lc-add-btn, .lc-add-btn-sm { border: 1px dashed var(--border-mid); background: none; color: var(--text-secondary); font-size: 12.5px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; border-radius: 7px; padding: 8px 14px; }
  .lc-add-btn:hover, .lc-add-btn-sm:hover { background: #e4eaf0; color: var(--text-primary); }
  .lc-add-btn-sm { padding: 6px 10px; font-size: 11.5px; border-radius: 6px; width: 100%; box-sizing: border-box; text-align: center; }
  .lc-remove-btn { border: none; background: none; color: var(--text-secondary); font-size: 15px; line-height: 1; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
  .lc-day .lc-remove-btn { display: none; }
  .lc-day.open .lc-remove-btn { display: inline-block; }
  .lc-remove-btn:hover { color: #a02020; }

  .lc-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #59544d; color: #fff; font-family: 'Poppins', sans-serif; font-size: 13.5px; font-weight: 600; padding: 10px 20px; border-radius: 99px; z-index: 10000; pointer-events: none; opacity: 0; transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.35s ease; white-space: nowrap; }
  .lc-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  canvas.lc-confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>
<div id="lift-cal-root"></div>
<script>
(function () {
  const TYPES = {
    shouldersA: { label: "Shoulders/Back + Legs A", color: "#6B8F71", badgeBg: "#dfe9df", badgeText: "#3f5c3f", category: "strength", exercises: [
      { n: "Overhead Press", s: "2 sets", sets: 2 },
      { n: "Gorilla Row", s: "2 sets", sets: 2 },
      { n: "Step-ups", s: "2 sets", sets: 2 },
    ]},
    shouldersB: { label: "Shoulders/Back + Legs B", color: "#6B8F71", badgeBg: "#dfe9df", badgeText: "#3f5c3f", category: "strength", exercises: [
      { n: "Overhead Press", s: "2 sets", sets: 2 },
      { n: "Gorilla Row", s: "2 sets", sets: 2 },
      { n: "Step-ups", s: "1 set", sets: 1 },
    ]},
    bench: { label: "Bench Push/Pull + Biceps", color: "#6B8F71", badgeBg: "#dfe9df", badgeText: "#3f5c3f", category: "strength", exercises: [
      { n: "Chest Press", s: "2 sets", sets: 2 },
      { n: "Supported Row", s: "2 sets", sets: 2 },
      { n: "Alternating Hammer Curl", s: "2 sets", sets: 2 },
    ]},
    lowerA: { label: "Lower Body + Carry A", color: "#6B8F71", badgeBg: "#dfe9df", badgeText: "#3f5c3f", category: "strength", exercises: [
      { n: "Squat", s: "2 sets", sets: 2 },
      { n: "Deadlift", s: "1 set", sets: 1 },
      { n: "Suitcase Carry", s: "2 sets", sets: 2 },
    ]},
    lowerB: { label: "Lower Body + Carry B", color: "#6B8F71", badgeBg: "#dfe9df", badgeText: "#3f5c3f", category: "strength", exercises: [
      { n: "Squat", s: "1 set", sets: 1 },
      { n: "Deadlift", s: "2 sets", sets: 2 },
      { n: "Suitcase Carry", s: "1 set", sets: 1 },
    ]},
    run: { label: "Run", color: "#A8654F", badgeBg: "#f0e0d8", badgeText: "#7a4632", category: "run", exercises: [
      { n: "Run", s: "Your pace / distance" },
    ]},
    rest: { label: "Rest", color: "#a39c8c", badgeBg: "#ece7dc", badgeText: "#7a7266", category: "rest", exercises: [] },
  };
  const RUN_EXTRA = { n: "Run", s: "", color: "#A8654F", badgeBg: "#f0e0d8", badgeText: "#7a4632" };
  const YOGA_EXTRA = { n: "Yoga", s: "", color: "#C9A05C", badgeBg: "#f2e6d0", badgeText: "#8a6a2e" };
  const MOBILITY_EXTRA = { n: "Mobility", s: "", color: "#6B8299", badgeBg: "#dee6ec", badgeText: "#3f5c73" };
  // Sun, Mon, Tue, Wed, Thu, Fri, Sat
  const DEFAULT_ORDER = ["bench", "shouldersA", "lowerA", "bench", "lowerB", "shouldersB", "rest"];
  const DEFAULT_EXTRA_RUN = [false, false, true, false, true, false, true]; // Tue, Thu run before lifting; Sat is run-only
  const DEFAULT_EXTRA_YOGA = [false, false, false, true, false, false, false]; // Wed
  const DEFAULT_EXTRA_MOBILITY = [false, false, false, false, false, false, false]; // off by default; added ad hoc
  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const PROGRAM_START = new Date(2026, 9, 4);  // Sun, Oct 4, 2026 — the day after your Oct 3 5k
  const PROGRAM_END = new Date(2026, 11, 31);  // Dec 31, 2026

  const root = document.getElementById("lift-cal-root");
  let dayTypes = DEFAULT_ORDER.slice();
  let extraRun = DEFAULT_EXTRA_RUN.slice();
  let extraYoga = DEFAULT_EXTRA_YOGA.slice();
  let extraMobility = DEFAULT_EXTRA_MOBILITY.slice();
  let yogaOverrides = {};    // dateIso -> true/false, one-off exceptions to the recurring extraYoga pattern
  let mobilityOverrides = {}; // dateIso -> true/false, one-off exceptions to the recurring extraMobility pattern
  let dayTypeOverrides = {}; // dateIso -> type key, one-off exceptions to the recurring dayTypes pattern
  let runOverrides = {};     // dateIso -> true/false, one-off exceptions to the recurring extraRun pattern
  let checks = {};
  let logs = {};
  let openWeeks = {};
  let openDays = {};
  let dragSrc = null;
  let swapSelected = null;
  let viewMode = "day"; // "week" or "day" — day-by-day is easiest to read on mobile
  let dayViewIndex = 0;
  let dayViewInitialized = false;
  let barMode = { run: "week", yoga: "week", mobility: "week", strength: "week" }; // "week" or "plan" per progress bar

  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function fmtDate(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
  function fmtDateYear(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }

  function buildWeeks() {
    const weeks = [];
    let cursor = new Date(PROGRAM_START);
    while (cursor <= PROGRAM_END) {
      const dates = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(cursor);
        d.setDate(cursor.getDate() + i);
        return d;
      });
      weeks.push(dates);
      cursor = new Date(cursor);
      cursor.setDate(cursor.getDate() + 7);
    }
    return weeks;
  }
  function flattenDays(weeks) {
    const flat = [];
    weeks.forEach((dates, wi) => {
      dates.forEach((d, di) => flat.push({ date: d, weekIndex: wi, dowIndex: di }));
    });
    return flat;
  }

  function defaultOpenWeekIndex(weeks) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    for (let i = 0; i < weeks.length; i++) {
      if (today <= weeks[i][6]) return i;
    }
    return weeks.length - 1;
  }
  function defaultDayIndex(allDays) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    for (let i = 0; i < allDays.length; i++) {
      if (isoDate(allDays[i].date) >= isoDate(today)) return i;
    }
    return allDays.length - 1;
  }

  // Plain-browser persistence: window.storage only exists inside Claude's own artifact
  // preview. Outside that (GitHub Pages, any normal hosting), it's undefined — so every
  // save/load would silently no-op. These wrappers use real localStorage instead, with the
  // same async {value} shape the rest of the code expects, and fall back to window.storage
  // only if it happens to be present (e.g. previewing inside Claude itself).
  async function storeGet(key) {
    if (window.storage && window.storage.get) {
      try { return await window.storage.get(key, false); } catch (e) {}
    }
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : { value: v };
    } catch (e) { return null; }
  }
  async function storeSet(key, value) {
    if (window.storage && window.storage.set) {
      try { return await window.storage.set(key, value, false); } catch (e) {}
    }
    try { localStorage.setItem(key, value); return { key, value }; } catch (e) { return null; }
  }
  async function load() {
    try {
      const t = await storeGet("runlift-cal-daytypes");

    try {

    } catch (e) {}
    try {

    try {
      const dto = await storeGet("runlift-cal-daytypeoverrides");

    } catch (e) {}
    try {
      const ro = await storeGet("runlift-cal-runoverrides");

    try {
      const c = await storeGet("runlift-cal-checks");

    } catch (e) {}
    try {
      const lg = await storeGet("runlift-cal-logs");
      if (lg && lg.value) logs = JSON.parse(lg.value);
    } catch (e) {}
    try {
      const v = await storeGet("runlift-cal-viewmode");
      if (v && v.value) viewMode = v.value;
    } catch (e) {}
    // barMode intentionally not restored from storage — all progress bars always start on "this week".
    // One-time migration: "run" used to be a main lift-type (pre-dating the standalone Run block).
    // If any day still has that from older saved data, move it to rest + extraRun so it doesn't show twice.
    let migrated = false;
    dayTypes.forEach((tk, i) => {
      if (tk === "run") {
        dayTypes[i] = "rest";
        extraRun[i] = true;
        migrated = true;
      }
    });
    if (migrated) {
      await saveDayTypes();
      await saveExtraRun();
    }
    // One-time correction: Tue/Wed strength assignment should be Tue=lowerA, Wed=bench.
    if (dayTypes[2] === "bench" && dayTypes[3] === "lowerA") {
      dayTypes[2] = "lowerA";
      dayTypes[3] = "bench";
      await saveDayTypes();
    }
    // One-time recovery pause: no lifting or running from the ER visit (Oct 7, 2026)
    // through 4 weeks out (Nov 6, 2026) — applied as one-off per-date overrides, so the
    // regular weekly pattern resumes automatically on Nov 7 without needing to be rebuilt.
    try {
      const rc = await storeGet("runlift-cal-recovery-applied-v2");
      if (!rc || !rc.value) {
        const RECOVERY_START = new Date(2026, 9, 7);   // Oct 7, 2026 (ER visit)
        const RECOVERY_END = new Date(2026, 10, 6);    // Nov 6, 2026
        const cursor = new Date(RECOVERY_START);
        while (cursor <= RECOVERY_END) {
          const rIso = isoDate(cursor);
          dayTypeOverrides[rIso] = "rest";
          runOverrides[rIso] = false;
          cursor.setDate(cursor.getDate() + 1);
        }
        await saveDayTypeOverrides();
        await saveRunOverrides();
        await storeSet("runlift-cal-recovery-applied-v2", "true");
      }
    } catch (e) {}
    // One-time: pause Yoga/Mobility from the ER visit through Oct 25, 2026.
    // No override is set from Oct 26 onward, so they resume on their normal pattern automatically.
    try {
      const yp = await storeGet("runlift-cal-yogapause-applied-v2");
      if (!yp || !yp.value) {
        const PAUSE_START = new Date(2026, 9, 7);   // Oct 7, 2026 (ER visit)
        const PAUSE_END = new Date(2026, 9, 25);    // Oct 25, 2026 (resumes Oct 26)
        const cursor2 = new Date(PAUSE_START);
        while (cursor2 <= PAUSE_END) {
          const pIso = isoDate(cursor2);
          yogaOverrides[pIso] = false;
          mobilityOverrides[pIso] = false;
          cursor2.setDate(cursor2.getDate() + 1);
        }
        await saveYogaOverrides();
        await saveMobilityOverrides();
        await storeSet("runlift-cal-yogapause-applied-v2", "true");
      }
    } catch (e) {}
    render();
  }

  // Effective on/off state for a specific date: a one-off override wins over the recurring weekly pattern.
  function effectiveYoga(dateIso, dowIndex) {
    return yogaOverrides.hasOwnProperty(dateIso) ? yogaOverrides[dateIso] : !!extraYoga[dowIndex];
  }
  function effectiveMobility(dateIso, dowIndex) {
    return mobilityOverrides.hasOwnProperty(dateIso) ? mobilityOverrides[dateIso] : !!extraMobility[dowIndex];
  }
  function effectiveDayType(dateIso, dowIndex) {
    return dayTypeOverrides.hasOwnProperty(dateIso) ? dayTypeOverrides[dateIso] : dayTypes[dowIndex];
  }
  function effectiveRun(dateIso, dowIndex) {
    return runOverrides.hasOwnProperty(dateIso) ? runOverrides[dateIso] : !!extraRun[dowIndex];
  }
  async function swapComponent(src, target, comp) {
    if (comp === "lift") {
      const a = effectiveDayType(src.dIso, src.day), b = effectiveDayType(target.dIso, target.day);
      dayTypeOverrides[src.dIso] = b; dayTypeOverrides[target.dIso] = a;
      await saveDayTypeOverrides();
    } else if (comp === "run") {
      const a = effectiveRun(src.dIso, src.day), b = effectiveRun(target.dIso, target.day);
      runOverrides[src.dIso] = b; runOverrides[target.dIso] = a;
      await saveRunOverrides();
    } else if (comp === "yoga") {
      const a = effectiveYoga(src.dIso, src.day), b = effectiveYoga(target.dIso, target.day);
      yogaOverrides[src.dIso] = b; yogaOverrides[target.dIso] = a;
      await saveYogaOverrides();
    } else if (comp === "mobility") {
      const a = effectiveMobility(src.dIso, src.day), b = effectiveMobility(target.dIso, target.day);
      mobilityOverrides[src.dIso] = b; mobilityOverrides[target.dIso] = a;
      await saveMobilityOverrides();
    }
  }

  function confettiBurst(x, y) {
    const canvas = document.createElement("canvas");
    canvas.className = "lc-confetti";
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    const colors = ["#C9A05C", "#6B8F71", "#A8654F", "#3f5c3f", "#7a4632", "#8a6a2e"];
    const particles = Array.from({ length: 80 }, () => ({
      x, y,
      vx: (Math.random() - 0.5) * 9,
      vy: Math.random() * -9 - 3,
      g: 0.28,
      size: Math.random() * 5 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      life: 1,
    }));
    let frame = 0;
    function tick() {
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.012;
        ctx.save();
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      if (frame < 110) requestAnimationFrame(tick);
      else canvas.remove();
    }
    tick();
  }
  function showToast(msg) {
    const t = document.createElement("div");
    t.className = "lc-toast";
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 400); }, 2200);
  }

  function csvCell(val) {
    const s = String(val == null ? "" : val);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  // Tri-state completion: "done", "skipped", or absent (unmarked/forgotten).
  function boxState(key) {
    return checks[key] === "done" ? "done" : checks[key] === "skipped" ? "skipped" : "none";
  }
  function boxHtml(key, color) {
    const state = boxState(key);
    const glyph = state === "done" ? "✓" : state === "skipped" ? "✕" : "";
    return `<span class="lc-box" data-state="${state}" style="--box-color:${color}">${glyph}</span>`;
  }
  function cycleCheck(key) {
    const cur = checks[key];
    if (cur === "done") checks[key] = "skipped";
    else if (cur === "skipped") delete checks[key];
    else checks[key] = "done";
  }
  function exportProgressCsv(weeks) {
    const rows = [["Date", "Day", "Category", "Activity", "Target", "Completed", "Notes"]];
    weeks.forEach((dates) => {
      dates.forEach((d, i) => {
        const dIso = isoDate(d);
        const dayName = d.toLocaleDateString(undefined, { weekday: "short" });
        const typeKey = effectiveDayType(dIso, i);
        const type = TYPES[typeKey];
        const hasExtraRun = effectiveRun(dIso, i);
        const hasExtraYoga = effectiveYoga(dIso, i);
        const hasExtraMobility = effectiveMobility(dIso, i);

        if (hasExtraRun) {
          const key = `${dIso}-extra-run`;
          rows.push([dIso, dayName, "Run", RUN_EXTRA.n, RUN_EXTRA.s, (checks[key] === "done" ? "Done" : checks[key] === "skipped" ? "Skipped" : ""), logs[key] || ""]);
        }
        type.exercises.forEach((ex, idx) => {
          const key = `${dIso}-${idx}`;
          rows.push([dIso, dayName, "Strength", ex.n, ex.s, (checks[key] === "done" ? "Done" : checks[key] === "skipped" ? "Skipped" : ""), logs[key] || ""]);
        });
        if (hasExtraYoga) {
          const key = `${dIso}-extra-yoga`;
          rows.push([dIso, dayName, "Yoga", YOGA_EXTRA.n, YOGA_EXTRA.s, (checks[key] === "done" ? "Done" : checks[key] === "skipped" ? "Skipped" : ""), logs[key] || ""]);
        }
        if (hasExtraMobility) {
          const key = `${dIso}-extra-mobility`;
          rows.push([dIso, dayName, "Mobility", MOBILITY_EXTRA.n, MOBILITY_EXTRA.s, (checks[key] === "done" ? "Done" : checks[key] === "skipped" ? "Skipped" : ""), logs[key] || ""]);
        }
      });
    });
    const csv = rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "run-lift-progress-export.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Export downloaded");
  }

  function dayExerciseCount(typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility) {
    return TYPES[typeKey].exercises.length + (hasExtraRun ? 1 : 0) + (hasExtraYoga ? 1 : 0) + (hasExtraMobility ? 1 : 0);
  }
  function dayProgress(dateIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility) {
    const total = dayExerciseCount(typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility);
    if (!total) return { done: 0, total: 0 };
    let done = TYPES[typeKey].exercises.filter((_, i) => checks[`${dateIso}-${i}`] === "done").length;
    if (hasExtraRun && checks[`${dateIso}-extra-run`] === "done") done += 1;
    if (hasExtraYoga && checks[`${dateIso}-extra-yoga`] === "done") done += 1;
    if (hasExtraMobility && checks[`${dateIso}-extra-mobility`] === "done") done += 1;
    return { done, total };
  }
  function daySegments(dateIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility) {
    const type = TYPES[typeKey];
    const segments = [];
    if (hasExtraRun) {
      segments.push({ total: 1, done: checks[`${dateIso}-extra-run`] === "done" ? 1 : 0, color: RUN_EXTRA.color });
    }
    if (type.exercises.length) {
      const done = type.exercises.filter((_, i) => checks[`${dateIso}-${i}`] === "done").length;
      segments.push({ total: type.exercises.length, done, color: type.color });
    }
    if (hasExtraYoga) {
      segments.push({ total: 1, done: checks[`${dateIso}-extra-yoga`] === "done" ? 1 : 0, color: YOGA_EXTRA.color });
    }
    if (hasExtraMobility) {
      segments.push({ total: 1, done: checks[`${dateIso}-extra-mobility`] === "done" ? 1 : 0, color: MOBILITY_EXTRA.color });
    }
    return segments;
  }
  function segmentedBarHtml(segments, trackClass, fillClass) {
    return segments.map((seg) => {
      const segPct = seg.total ? Math.round((seg.done / seg.total) * 100) : 0;
      return `<div style="flex:${seg.total} 0 0%; height:100%; overflow:hidden; border-radius:inherit;">
        <div class="${fillClass}" style="width:${segPct}%;height:100%;background:${seg.color};"></div>
      </div>`;
    }).join(`<div style="width:2px;flex-shrink:0;"></div>`);
  }
  function weekProgress(dates) {
    let done = 0, total = 0;
    dates.forEach((d, i) => {
      const dIso = isoDate(d);
      const p = dayProgress(dIso, effectiveDayType(dIso, i), effectiveRun(dIso, i), effectiveYoga(dIso, i), effectiveMobility(dIso, i));
      done += p.done; total += p.total;
    });
    return { done, total };
  }
  function dayCategoryProgress(dateIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility, category) {
    const type = TYPES[typeKey];
    let done = 0, total = 0;
    if (type.category === category) {
      total += type.exercises.length;
      done += type.exercises.filter((_, i) => checks[`${dateIso}-${i}`] === "done").length;
    }
    if (category === "run" && hasExtraRun) {
      total += 1;
      if (checks[`${dateIso}-extra-run`] === "done") done += 1;
    }
    if (category === "yoga" && hasExtraYoga) {
      total += 1;
      if (checks[`${dateIso}-extra-yoga`] === "done") done += 1;
    }
    if (category === "mobility" && hasExtraMobility) {
      total += 1;
      if (checks[`${dateIso}-extra-mobility`] === "done") done += 1;
    }
    return { done, total };
  }
  function weekCategoryProgress(dates, category) {
    let done = 0, total = 0;
    dates.forEach((d, i) => {
      const dIso = isoDate(d);
      const p = dayCategoryProgress(dIso, effectiveDayType(dIso, i), effectiveRun(dIso, i), effectiveYoga(dIso, i), effectiveMobility(dIso, i), category);
      done += p.done; total += p.total;
    });
    return { done, total };
  }
  function weekStrengthSets(dates) {
    let done = 0, total = 0;
    dates.forEach((d, i) => {
      const dIso = isoDate(d);
      const type = TYPES[effectiveDayType(dIso, i)];
      if (type.category !== "strength") return;
      type.exercises.forEach((ex, idx) => {
        total += ex.sets;
        if (checks[`${dIso}-${idx}`] === "done") done += ex.sets;
      });
    });
    return { done, total };
  }
  function planStrengthSets(weeks) {
    let done = 0, total = 0;
    weeks.forEach((dates) => {
      const wk = weekStrengthSets(dates);
      done += wk.done; total += wk.total;
    });
    return { done, total };
  }

  function render() {
    const weeks = buildWeeks();
    const allDays = flattenDays(weeks);
    if (Object.keys(openWeeks).length === 0) openWeeks[defaultOpenWeekIndex(weeks)] = true;
    if (!dayViewInitialized) { dayViewIndex = defaultDayIndex(allDays); dayViewInitialized = true; }
    dayViewIndex = Math.max(0, Math.min(dayViewIndex, allDays.length - 1));

    let programDone = 0, programTotal = 0, weeksComplete = 0;
    let runPlan = { done: 0, total: 0 }, yogaPlan = { done: 0, total: 0 }, mobilityPlan = { done: 0, total: 0 };
    weeks.forEach((dates) => {
      const wp = weekProgress(dates);
      programDone += wp.done; programTotal += wp.total;
      if (wp.total > 0 && wp.done === wp.total) weeksComplete += 1;
      const rp = weekCategoryProgress(dates, "run"); runPlan.done += rp.done; runPlan.total += rp.total;
      const yp = weekCategoryProgress(dates, "yoga"); yogaPlan.done += yp.done; yogaPlan.total += yp.total;
      const mp = weekCategoryProgress(dates, "mobility"); mobilityPlan.done += mp.done; mobilityPlan.total += mp.total;
    });
    const strengthPlan = planStrengthSets(weeks);
    const currentWeekIndex = defaultOpenWeekIndex(weeks);
    const currentWeekDates = weeks[currentWeekIndex];
    const runWeek = weekCategoryProgress(currentWeekDates, "run");
    const yogaWeek = weekCategoryProgress(currentWeekDates, "yoga");
    const mobilityWeek = weekCategoryProgress(currentWeekDates, "mobility");
    const strengthWeek = weekStrengthSets(currentWeekDates);

    function progressBarHtml(catKey, label, color, weekVal, planVal, unit) {
      const mode = barMode[catKey];
      const val = mode === "week" ? weekVal : planVal;
      const pct = val.total ? Math.round((val.done / val.total) * 100) : 0;
      const flipLabel = mode === "week" ? "Whole plan" : "This week";
      const unitSuffix = unit ? ` ${unit}` : "";
      return `
        <div class="lc-progress-wrap">
          <div class="lc-progress-label">
            <span>${label} <button class="lc-progress-flip" type="button" data-cat="${catKey}">⇄ ${flipLabel}</button></span>
            <span>${val.done}/${val.total}${unitSuffix}</span>
          </div>
          <div class="lc-progress-track"><div class="lc-progress-fill-week" style="width:${pct}%;background:${color}"></div></div>
        </div>`;
    }

    root.innerHTML = `
      <div class="lc-header">
        <div>
          <p class="lc-eyebrow">Training Plan</p>
          <p class="lc-title">Run + Lift Split</p>
          <p class="lc-sub">${fmtDateYear(weeks[0][0])} – ${fmtDateYear(weeks[weeks.length - 1][6])}</p>
        </div>
        <div class="lc-stats">
          <div class="num">${weeksComplete}/${weeks.length}</div>
          <div class="lbl">weeks complete</div>
          <button class="lc-export-btn" id="lc-export">Export progress</button>
        </div>
      </div>
      ${progressBarHtml("run", "Runs", TYPES.run.color, runWeek, runPlan, "")}
      ${progressBarHtml("yoga", "Yoga", YOGA_EXTRA.color, yogaWeek, yogaPlan, "")}
      ${progressBarHtml("mobility", "Mobility", MOBILITY_EXTRA.color, mobilityWeek, mobilityPlan, "")}
      ${progressBarHtml("strength", "Strength", TYPES.bench.color, strengthWeek, strengthPlan, "sets")}
      <div class="lc-viewtoggle">
        <button data-mode="day" class="${viewMode === "day" ? "active" : ""}">Day-by-day</button>
        <button data-mode="week" class="${viewMode === "week" ? "active" : ""}">Week grid</button>
      </div>
      ${viewMode === "week" ? `<div class="lc-hint">Drag any block to another day to swap it there for that week only (or tap its ⇄, then tap ⇄ on the target day). Your regular weekly pattern isn't changed.</div>` : ""}
      <div id="lc-body"></div>
    `;

    root.querySelectorAll(".lc-viewtoggle button").forEach((btn) => {
      btn.addEventListener("click", async () => {
        viewMode = btn.dataset.mode;
        if (viewMode === "day") dayViewIndex = defaultDayIndex(allDays);
        await saveViewMode();
        render();
      });
    });
    root.querySelectorAll(".lc-progress-flip").forEach((btn) => {
      btn.addEventListener("click", () => {
        const cat = btn.dataset.cat;
        barMode[cat] = barMode[cat] === "week" ? "plan" : "week";
        render();
      });
    });
    const exportBtn = root.querySelector("#lc-export");
    if (exportBtn) exportBtn.addEventListener("click", () => exportProgressCsv(weeks));

    const body = document.getElementById("lc-body");
    if (viewMode === "day") {
      renderDayView(body, allDays);
    } else {
      renderWeekView(body, weeks);
    }
  }

  function renderDayView(container, allDays) {
    const entry = allDays[dayViewIndex];
    const d = entry.date;
    const dIso = isoDate(d);
    const typeKey = effectiveDayType(dIso, entry.dowIndex);
    const type = TYPES[typeKey];
    const hasExtraRun = effectiveRun(dIso, entry.dowIndex);
    const hasExtraYoga = effectiveYoga(dIso, entry.dowIndex);
    const hasExtraMobility = effectiveMobility(dIso, entry.dowIndex);
    const p = dayProgress(dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility);
    const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
    const segs = daySegments(dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility);
    const extraKey = `${dIso}-extra-run`;
    const extraYogaKey = `${dIso}-extra-yoga`;
    const extraMobilityKey = `${dIso}-extra-mobility`;

    const wrap = document.createElement("div");
    wrap.className = "lc-dayview";
    wrap.innerHTML = `
      <div class="lc-dv-nav">
        <button class="lc-dv-nav-btn" id="lc-dv-prev" ${dayViewIndex === 0 ? "disabled" : ""}>‹</button>
        <div class="lc-dv-center">

        <div class="lc-dv-badges">
          ${type.exercises.length ? `<span class="lc-type-badge" style="background:${type.badgeBg};color:${type.badgeText}">${type.label}</span>` : ""}
          ${hasExtraRun ? `<span class="lc-type-badge" style="background:${RUN_EXTRA.badgeBg};color:${RUN_EXTRA.badgeText}">Run</span>` : ""}
          ${hasExtraYoga ? `<span class="lc-type-badge" style="background:${YOGA_EXTRA.badgeBg};color:${YOGA_EXTRA.badgeText}">Yoga</span>` : ""}
          ${hasExtraMobility ? `<span class="lc-type-badge" style="background:${MOBILITY_EXTRA.badgeBg};color:${MOBILITY_EXTRA.badgeText}">Mobility</span>` : ""}
        </div>
      </div>
      ${p.total ? `<div class="lc-dv-progress-track">${segmentedBarHtml(segs, "lc-dv-progress-track", "lc-dv-progress-fill")}</div>` : ""}
      <div id="lc-dv-list"></div>
      <div class="lc-dv-add-row">
        ${!hasExtraYoga ? `<button class="lc-add-btn" id="lc-dv-add-yoga">+ Yoga</button>` : ""}
        ${!hasExtraMobility ? `<button class="lc-add-btn" id="lc-dv-add-mobility">+ Mobility</button>` : ""}
      </div>
      <div class="lc-dv-jump"><button id="lc-dv-today">Jump to today</button></div>
    `;
    container.appendChild(wrap);

    const list = wrap.querySelector("#lc-dv-list");
    if (!p.total) {
      list.innerHTML = `<div class="lc-dv-rest">Recovery day.</div>`;
    } else {
      const ul = document.createElement("ul");
      ul.className = "lc-dv-ex-list";
      if (hasExtraRun) {
        const state = boxState(extraKey);
        const logVal = (logs[extraKey] || "").replace(/"/g, "&quot;");
        const li = document.createElement("li");
        li.className = "lc-dv-ex" + (state === "done" ? " checked" : state === "skipped" ? " skipped" : "");
        li.innerHTML = `${boxHtml(extraKey, RUN_EXTRA.color)}
          <span style="flex:1"><span class="name">${RUN_EXTRA.n}</span><span class="sets">${RUN_EXTRA.s}</span>
            <input type="text" class="lc-log-input" placeholder="distance / time / notes" value="${logVal}" />
          </span>`;
        li.addEventListener("click", (e) => {
          if (e.target.classList.contains("lc-log-input")) return;
          toggleDayViewCheck(extraKey, dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility, wrap);
        });
        const runInput = li.querySelector(".lc-log-input");
        runInput.addEventListener("click", (e) => e.stopPropagation());
        runInput.addEventListener("change", async () => {
          logs[extraKey] = runInput.value;
          await saveLogs();
        });
        ul.appendChild(li);
      }
      type.exercises.forEach((ex, idx) => {
        const key = `${dIso}-${idx}`;
        const state = boxState(key);
        const logVal = logs[key] || "";
        const li = document.createElement("li");
        li.className = "lc-dv-ex" + (state === "done" ? " checked" : state === "skipped" ? " skipped" : "");
        li.innerHTML = `${boxHtml(key, type.color)}
          <span style="flex:1"><span class="name">${ex.n}</span><span class="sets">${ex.s}</span>
            <input type="text" class="lc-log-input" placeholder="weight × reps" value="${logVal.replace(/"/g, "&quot;")}" />
          </span>`;
        li.addEventListener("click", (e) => {
          if (e.target.classList.contains("lc-log-input")) return;
          toggleDayViewCheck(key, dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility, wrap);
        });
        const input = li.querySelector(".lc-log-input");
        input.addEventListener("click", (e) => e.stopPropagation());
        input.addEventListener("change", async () => {
          logs[key] = input.value;
          await saveLogs();
        });
        ul.appendChild(li);
      });
      if (hasExtraYoga) {
        const state = boxState(extraYogaKey);
        const logVal = (logs[extraYogaKey] || "").replace(/"/g, "&quot;");
        const li = document.createElement("li");
        li.className = "lc-dv-ex" + (state === "done" ? " checked" : state === "skipped" ? " skipped" : "");
        li.innerHTML = `${boxHtml(extraYogaKey, YOGA_EXTRA.color)}
          <span style="flex:1"><span class="name">${YOGA_EXTRA.n}</span><span class="sets">${YOGA_EXTRA.s}</span>
            <input type="text" class="lc-log-input" placeholder="notes" value="${logVal}" />
          </span>
          <button class="lc-remove-btn" data-remove="yoga" title="Remove yoga from this day">×</button>`;
        li.querySelector(".lc-remove-btn").addEventListener("click", async (e) => {
          e.stopPropagation();
          yogaOverrides[dIso] = false;
          await saveYogaOverrides();
          render();
        });
        li.addEventListener("click", (e) => {
          if (e.target.classList.contains("lc-remove-btn") || e.target.classList.contains("lc-log-input")) return;
          toggleDayViewCheck(extraYogaKey, dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility, wrap);
        });
        const yogaInput = li.querySelector(".lc-log-input");
        yogaInput.addEventListener("click", (e) => e.stopPropagation());
        yogaInput.addEventListener("change", async () => {
          logs[extraYogaKey] = yogaInput.value;
          await saveLogs();
        });
        ul.appendChild(li);
      }
      if (hasExtraMobility) {
        const state = boxState(extraMobilityKey);
        const logVal = (logs[extraMobilityKey] || "").replace(/"/g, "&quot;");
        const li = document.createElement("li");
        li.className = "lc-dv-ex" + (state === "done" ? " checked" : state === "skipped" ? " skipped" : "");
        li.innerHTML = `${boxHtml(extraMobilityKey, MOBILITY_EXTRA.color)}
          <span style="flex:1"><span class="name">${MOBILITY_EXTRA.n}</span><span class="sets">${MOBILITY_EXTRA.s}</span>
            <input type="text" class="lc-log-input" placeholder="notes" value="${logVal}" />
          </span>
          <button class="lc-remove-btn" data-remove="mobility" title="Remove mobility from this day">×</button>`;
        li.querySelector(".lc-remove-btn").addEventListener("click", async (e) => {
          e.stopPropagation();
          mobilityOverrides[dIso] = false;
          await saveMobilityOverrides();
          render();
        });
        li.addEventListener("click", (e) => {
          if (e.target.classList.contains("lc-remove-btn") || e.target.classList.contains("lc-log-input")) return;
          toggleDayViewCheck(extraMobilityKey, dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility, wrap);
        });
        const mobilityInput = li.querySelector(".lc-log-input");
        mobilityInput.addEventListener("click", (e) => e.stopPropagation());
        mobilityInput.addEventListener("change", async () => {
          logs[extraMobilityKey] = mobilityInput.value;
          await saveLogs();
        });
        ul.appendChild(li);
      }
      list.appendChild(ul);
    }

    const addYogaBtn = wrap.querySelector("#lc-dv-add-yoga");
    if (addYogaBtn) addYogaBtn.addEventListener("click", async () => {
      yogaOverrides[dIso] = true;
      await saveYogaOverrides();
      render();
    });
    const addMobilityBtn = wrap.querySelector("#lc-dv-add-mobility");
    if (addMobilityBtn) addMobilityBtn.addEventListener("click", async () => {
      mobilityOverrides[dIso] = true;
      await saveMobilityOverrides();
      render();
    });

    wrap.querySelector("#lc-dv-prev").addEventListener("click", () => { dayViewIndex -= 1; render(); });
    wrap.querySelector("#lc-dv-next").addEventListener("click", () => { dayViewIndex += 1; render(); });
    wrap.querySelector("#lc-dv-today").addEventListener("click", () => { dayViewIndex = defaultDayIndex(allDays); render(); });
  }

  async function toggleDayViewCheck(key, dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility, wrap) {
    cycleCheck(key);
    await saveChecks();
    const np = dayProgress(dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility);
    if (checks[key] === "done" && np.total > 0 && np.done === np.total) {
      const rect = wrap.getBoundingClientRect();
      confettiBurst(rect.left + rect.width / 2, rect.top + 80);
    }
    render();
  }

  function renderWeekView(container, weeks) {
    const weeksEl = document.createElement("div");
    container.appendChild(weeksEl);
    weeks.forEach((dates, wi) => {
      const wp = weekProgress(dates);
      const wPct = wp.total ? Math.round((wp.done / wp.total) * 100) : 0;
      const complete = wp.total > 0 && wp.done === wp.total;
      const isOpen = !!openWeeks[wi];

      const weekEl = document.createElement("div");
      weekEl.className = "lc-week" + (isOpen ? " open" : "") + (complete ? " week-complete" : "");
      weekEl.innerHTML = `
        <div class="lc-week-head">
          <div class="lc-week-head-left">
            <span class="lc-caret">▸</span>
            <span class="lc-week-label">Week ${wi + 1}</span>
            <span class="lc-week-dates">${fmtDate(dates[0])} – ${fmtDate(dates[6])}</span>
          </div>
          <div class="lc-week-head-left">
            <div class="lc-week-mini-track"><div class="lc-week-mini-fill" style="width:${wPct}%"></div></div>
            <span class="lc-week-pct">${wPct}%</span>
          </div>
        </div>
        <div class="lc-week-body">
          <div class="lc-grid" id="lc-grid-${wi}"></div>
          <div class="lc-week-footer"><button class="lc-reset" data-week="${wi}">Reset this week</button></div>
        </div>
      `;
      weekEl.querySelector(".lc-week-head").addEventListener("click", () => { openWeeks[wi] = !openWeeks[wi]; render(); });
      weeksEl.appendChild(weekEl);
      if (!isOpen) return;

      const grid = weekEl.querySelector(`#lc-grid-${wi}`);
      dates.forEach((d, i) => {
        const dIso = isoDate(d);
        const typeKey = effectiveDayType(dIso, i);
        const type = TYPES[typeKey];
        const hasExtraRun = effectiveRun(dIso, i);
        const hasExtraYoga = effectiveYoga(dIso, i);
        const hasExtraMobility = effectiveMobility(dIso, i);
        const p = dayProgress(dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility);
        const segs = daySegments(dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility);
        const dayComplete = p.total > 0 && p.done === p.total;
        const card = document.createElement("div");
        card.className = "lc-day" + (dayComplete ? " complete" : "") + (openDays[dIso] ? " open" : "");
        card.dataset.index = i;

        const extraKey = `${dIso}-extra-run`;
        const extraState = boxState(extraKey);
        const extraYogaKey = `${dIso}-extra-yoga`;
        const extraYogaState = boxState(extraYogaKey);
        const extraMobilityKey = `${dIso}-extra-mobility`;
        const extraMobilityState = boxState(extraMobilityKey);

        function compHead(comp, label, badgeBg, badgeText, removable) {
          const selected = swapSelected && swapSelected.day === i && swapSelected.comp === comp;
          return `<div class="lc-comp-head">
              <span class="lc-drag-handle" title="Drag to move to another day">⠿</span>
              <span class="lc-type-badge" style="background:${badgeBg};color:${badgeText}">${label}</span>
              <button class="lc-swap-btn${selected ? " selected" : ""}" data-swap-comp="${comp}" title="Tap to move this to another day">⇄</button>
              ${removable ? `<button class="lc-remove-btn" data-remove-comp="${comp}" title="Remove from this day">×</button>` : ""}
            </div>`;
        }
        function compClass(comp) {
          return swapSelected && swapSelected.day === i && swapSelected.comp === comp ? " swap-selected" : "";
        }
        function exClass(state) {
          return state === "done" ? " checked" : state === "skipped" ? " skipped" : "";
        }

        const runCompHtml = hasExtraRun ? `
          <div class="lc-comp${compClass("run")}" draggable="true" data-comp="run">
            ${compHead("run", RUN_EXTRA.n, RUN_EXTRA.badgeBg, RUN_EXTRA.badgeText, false)}
            <ul class="lc-ex-list">
              <li class="lc-ex${exClass(extraState)}" data-key="${extraKey}">
                ${boxHtml(extraKey, RUN_EXTRA.color)}
                <span style="flex:1"><span class="name">${RUN_EXTRA.n}</span><span class="sets">${RUN_EXTRA.s}</span>
                  <input type="text" class="lc-log-input" data-log-key="${extraKey}" placeholder="distance / time / notes" value="${(logs[extraKey] || "").replace(/"/g, "&quot;")}" />
                </span>
              </li>
            </ul>
          </div>` : "";

        const mainExHtml = type.exercises.map((ex, idx) => {
          const key = `${dIso}-${idx}`;
          const state = boxState(key);
          const logVal = (logs[key] || "").replace(/"/g, "&quot;");
          return `<li class="lc-ex${exClass(state)}" data-key="${key}">
            ${boxHtml(key, type.color)}
            <span style="flex:1"><span class="name">${ex.n}</span><span class="sets">${ex.s}</span>
              <input type="text" class="lc-log-input" data-log-key="${key}" placeholder="weight × reps" value="${logVal}" />
            </span>
          </li>`;
        }).join("");

        const liftCompHtml = type.exercises.length ? `
          <div class="lc-comp${compClass("lift")}" draggable="true" data-comp="lift">
            ${compHead("lift", "Lift", type.badgeBg, type.badgeText, false)}
            <ul class="lc-ex-list">${mainExHtml}</ul>
          </div>` : "";

        const yogaCompHtml = hasExtraYoga ? `
          <div class="lc-comp${compClass("yoga")}" draggable="true" data-comp="yoga">
            ${compHead("yoga", YOGA_EXTRA.n, YOGA_EXTRA.badgeBg, YOGA_EXTRA.badgeText, false)}
            <ul class="lc-ex-list">
              <li class="lc-ex${exClass(extraYogaState)}" data-key="${extraYogaKey}">
                ${boxHtml(extraYogaKey, YOGA_EXTRA.color)}
                <span style="flex:1"><span class="name">${YOGA_EXTRA.n}</span><span class="sets">${YOGA_EXTRA.s}</span>
                  <input type="text" class="lc-log-input" data-log-key="${extraYogaKey}" placeholder="notes" value="${(logs[extraYogaKey] || "").replace(/"/g, "&quot;")}" />
                </span>
              </li>
            </ul>
          </div>` : "";

        const mobilityCompHtml = hasExtraMobility ? `
          <div class="lc-comp${compClass("mobility")}" draggable="true" data-comp="mobility">
            ${compHead("mobility", MOBILITY_EXTRA.n, MOBILITY_EXTRA.badgeBg, MOBILITY_EXTRA.badgeText, true)}
            <ul class="lc-ex-list">
              <li class="lc-ex${exClass(extraMobilityState)}" data-key="${extraMobilityKey}">
                ${boxHtml(extraMobilityKey, MOBILITY_EXTRA.color)}
                <span style="flex:1"><span class="name">${MOBILITY_EXTRA.n}</span><span class="sets">${MOBILITY_EXTRA.s}</span>
                  <input type="text" class="lc-log-input" data-log-key="${extraMobilityKey}" placeholder="notes" value="${(logs[extraMobilityKey] || "").replace(/"/g, "&quot;")}" />
                </span>
              </li>
            </ul>
          </div>` : "";

        const addRowHtml = (!hasExtraYoga || !hasExtraMobility) ? `
          <div class="lc-comp-add-row">
            ${!hasExtraYoga ? `<button class="lc-add-btn-sm" data-add="yoga">+ Yoga</button>` : ""}
            ${!hasExtraMobility ? `<button class="lc-add-btn-sm" data-add="mobility">+ Mobility</button>` : ""}
          </div>` : "";

        card.innerHTML = `
          <div class="lc-day-name">${DAY_NAMES[i]}</div>
          <div class="lc-day-date">${fmtDate(d)}</div>
          ${p.total ? `<div class="lc-progress-track-day">${segmentedBarHtml(segs, "lc-progress-track-day", "lc-progress-fill")}</div>` : ""}
          <div class="lc-comp-list">${runCompHtml}${liftCompHtml}${yogaCompHtml}${mobilityCompHtml}</div>
          ${addRowHtml}
          ${p.total ? `<div class="lc-toggle">tap a block to toggle exercises</div>` : ""}
        `;

        card.addEventListener("click", (e) => {
          if (e.target.tagName === "INPUT" || e.target.closest(".lc-swap-btn") || e.target.closest(".lc-remove-btn") || e.target.closest(".lc-add-btn-sm")) return;
          openDays[dIso] = !openDays[dIso];
          card.classList.toggle("open");
        });
        card.querySelectorAll(".lc-ex").forEach((li) => {
          li.addEventListener("click", async (e) => {
            if (e.target.classList.contains("lc-log-input")) return;
            e.stopPropagation();
            const key = li.dataset.key;
            cycleCheck(key);
            await saveChecks();
            const wasWeekComplete = complete;
            const newWp = weekProgress(dates);
            const nowWeekComplete = newWp.total > 0 && newWp.done === newWp.total;
            const np = dayProgress(dIso, typeKey, hasExtraRun, hasExtraYoga, hasExtraMobility);
            if (checks[key] === "done" && np.total > 0 && np.done === np.total) {
              const rect = card.getBoundingClientRect();
              confettiBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            }
            if (!wasWeekComplete && nowWeekComplete) showToast(`Week ${wi + 1} complete! 🎉`);
            render();
          });
        });
        card.querySelectorAll(".lc-log-input").forEach((input) => {
          input.addEventListener("click", (e) => e.stopPropagation());
          input.addEventListener("change", async () => {
            logs[input.dataset.logKey] = input.value;
            await saveLogs();
          });
        });

        // Each component (run / lift / yoga / mobility) is independently draggable; the whole card is the drop zone.
        card.querySelectorAll(".lc-comp").forEach((compEl) => {
          compEl.addEventListener("dragstart", (e) => {
            e.stopPropagation();
            dragSrc = { day: i, dIso, comp: compEl.dataset.comp };
            compEl.classList.add("dragging");
          });
          compEl.addEventListener("dragend", () => compEl.classList.remove("dragging"));
        });
        card.addEventListener("dragover", (e) => { e.preventDefault(); card.classList.add("drag-over"); });
        card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
        card.addEventListener("drop", async (e) => {
          e.preventDefault();
          card.classList.remove("drag-over");
          if (!dragSrc || dragSrc.day === i) { dragSrc = null; return; }
          await swapComponent(dragSrc, { day: i, dIso }, dragSrc.comp);
          dragSrc = null;
          render();
        });

        // Tap-to-swap alternative (works on touch): tap a block's ⇄, then tap the same-type block's ⇄ on another day.
        card.querySelectorAll(".lc-swap-btn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const comp = btn.dataset.swapComp;
            if (swapSelected === null) {
              swapSelected = { day: i, dIso, comp };
            } else if (swapSelected.day === i && swapSelected.comp === comp) {
              swapSelected = null;
            } else if (swapSelected.comp === comp) {
              await swapComponent(swapSelected, { day: i, dIso }, comp);
              swapSelected = null;
            } else {
              swapSelected = { day: i, dIso, comp };
            }
            render();
          });
        });

        // Remove an optional (yoga/mobility) block from this day — one-off, just this date
        card.querySelectorAll(".lc-remove-btn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const comp = btn.dataset.removeComp;
            if (comp === "yoga") { yogaOverrides[dIso] = false; await saveYogaOverrides(); }
            else if (comp === "mobility") { mobilityOverrides[dIso] = false; await saveMobilityOverrides(); }
            render();
          });
        });

        // Add yoga/mobility to this day on the fly — one-off, just this date
        card.querySelectorAll(".lc-add-btn-sm").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const comp = btn.dataset.add;
            if (comp === "yoga") { yogaOverrides[dIso] = true; await saveYogaOverrides(); }
            else if (comp === "mobility") { mobilityOverrides[dIso] = true; await saveMobilityOverrides(); }
            render();
          });
        });

        grid.appendChild(card);
      });

      weekEl.querySelector(".lc-reset").addEventListener("click", async (e) => {
        e.stopPropagation();
        dates.forEach((d, i) => {
          const dIso = isoDate(d);
          const type = TYPES[effectiveDayType(dIso, i)];
          type.exercises.forEach((_, idx) => {
            delete checks[`${dIso}-${idx}`];
            delete logs[`${dIso}-${idx}`];
          });
          delete checks[`${dIso}-extra-run`];
          delete checks[`${dIso}-extra-yoga`];
          delete checks[`${dIso}-extra-mobility`];
        });
        await saveChecks();
        await saveLogs();
        render();
      });
    });
  }

  load();
})();
</script>
</body>
</html>
